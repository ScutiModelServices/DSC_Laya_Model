# Load balancer in front of the dsc_laya_model replicas. Docker DNS gives `dsc_laya_model` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream dsc_laya_model {
    least_conn;
    server dsc_laya_model:29220 max_fails=2 fail_timeout=10s;
}

server {
    listen 29220;
    client_max_body_size 1m;

    location / {
        proxy_pass http://dsc_laya_model;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 60s;
        # predict is a pure function of its body, so another replica may repeat it. 503 is not retried: it means
        # every project slot stayed busy for SERVICE_PROJECT_WAIT_SECONDS, and a second replica would wait that long again.
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
    }
}
